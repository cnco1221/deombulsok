<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>덤불속 - In a Grove</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="screen-lobby" class="screen">
  <div class="lobby-wrap">
    <h1>🌿 덤불속 <span class="sub">In a Grove</span></h1>

    <div id="lobby-entry" class="card">
      <div class="field">
        <label>닉네임</label>
        <input id="nickname-input" maxlength="10" placeholder="닉네임 입력">
      </div>
      <div class="row">
        <button id="create-room-btn" class="primary">방 만들기</button>
      </div>
      <div class="row join-row">
        <input id="join-code-input" maxlength="3" inputmode="numeric" pattern="[0-9]*" placeholder="방 코드 3자리">
        <button id="join-room-btn">입장하기</button>
      </div>
      <p id="lobby-error" class="error"></p>
    </div>

    <div id="lobby-room" class="card hidden">
      <h2>방 코드: <span id="room-code-display"></span></h2>
      <ul id="player-list"></ul>
      <div class="row bot-toggle-row">
        <label class="toggle">
          <input type="checkbox" id="bot-toggle">
          부족 인원 봇으로 채우기 (최대 5인)
        </label>
      </div>
      <button id="start-game-btn" class="primary hidden">게임 시작</button>
      <p class="hint" id="waiting-hint">방장이 게임을 시작할 때까지 기다리세요...</p>
    </div>

    <div id="lobby-resuming" class="card hidden">
      <p class="hint">이전 게임에 재접속하는 중...</p>
    </div>
  </div>
</div>

<div id="screen-game" class="screen hidden">
  <header class="game-header">
    <div>라운드 <b id="hdr-round"></b> / <span id="hdr-max-round"></span></div>
  </header>

  <div class="log-latest" id="log-latest"></div>

  <div class="table-area" id="table-area">
    <div class="players-ring" id="players-strip"></div>

    <main class="board">
      <div class="crime-scene">
        <div class="victim-card">
          <div class="card-face back">
            <svg class="person-svg" viewBox="0 0 100 170" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
              <path class="person-shape" d="M27,48 L73,48 Q78,48 78,53 L78,160 Q78,165 73,165 L56,165 L56,100 L44,100 L44,165 L27,165 Q22,165 22,160 L22,53 Q22,48 27,48 Z"></path>
              <circle class="person-shape" cx="50" cy="30" r="18"></circle>
            </svg>
            <svg class="blood-splatter" viewBox="0 0 100 170" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
              <path class="blood-pool" d="M6,165 C4,158 14,151 27,154 C35,149 47,151 51,156 C59,149 73,151 79,156 C91,153 97,160 93,166 C70,169 28,169 6,165 Z"></path>
              <ellipse class="blood-spot" cx="45" cy="70" rx="14" ry="9" transform="rotate(-20 45 70)"></ellipse>
              <ellipse class="blood-spot" cx="59" cy="80" rx="8" ry="6" transform="rotate(15 59 80)"></ellipse>
              <ellipse class="blood-spot" cx="35" cy="90" rx="6" ry="9" transform="rotate(-10 35 90)"></ellipse>
              <circle class="blood-spot" cx="67" cy="59" r="4"></circle>
              <circle class="blood-spot" cx="27" cy="65" r="3"></circle>
              <path class="blood-drip" d="M47,84 C46,94 44,104 46,113 C48,104 49,94 47,84 Z"></path>
              <path class="blood-drip" d="M58,88 C57,96 56,102 58,109 C59,101 59,94 58,88 Z"></path>
            </svg>
            <span class="card-number victim-label">피해자</span>
          </div>
        </div>
        <div class="suspects-row" id="suspects-row"></div>
      </div>

      <div id="shared-card-box" class="hidden">
        <div class="label">공개 카드 (둘 다 확인 가능)</div>
        <div class="mini-card" id="shared-card-value"></div>
      </div>

    </main>
  </div>

  <div id="my-hand" class="my-hand hidden"></div>

  <div class="bottom-bar" id="bottom-bar">
    <div class="action-row">
      <span class="phase-title" id="phase-title">-</span>
      <div id="action-body"></div>
    </div>
  </div>
</div>

<div id="overlay" class="overlay hidden">
  <div class="overlay-box" id="overlay-box"></div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="app.js"></script>
</body>
</html>
